<!doctype html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro - Monitor de Quedas (Simpósio)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0e1a',
                        darkCard: '#111627',
                        accent: '#ff4d6a'
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Outfit', sans-serif; }
        .card-glass { backdrop-filter: blur(12px); }
    </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-darkBg text-slate-800 dark:text-slate-200 flex flex-col justify-center items-center p-4 transition-colors duration-300">

    <!-- Topo e alternância de tema -->
    <div class="w-full max-w-md flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-accent/15 border border-accent/30 flex items-center justify-center text-accent">
                <i data-lucide="shield-alert" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 dark:text-white leading-tight">Pulseira Inteligente</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Monitoramento de Quedas (Sensor BMI160)</p>
            </div>
        </div>

        <button onclick="toggleTheme()" type="button" class="p-2.5 rounded-full bg-white dark:bg-darkCard border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
            <i data-lucide="moon" id="theme-icon" class="w-4 h-4 text-slate-700 dark:text-yellow-400"></i>
        </button>
    </div>

    <!-- Card Principal -->
    <div class="w-full max-w-md card-glass rounded-2xl p-6 sm:p-8 bg-white dark:bg-darkCard border border-slate-200 dark:border-slate-800 shadow-xl">

        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-5 space-y-2">
              {% for category, message in messages %}
                <div class="px-4 py-3 rounded-xl text-xs font-medium flex items-center gap-2 {% if category == 'erro' %}bg-red-500/10 text-red-500 border border-red-500/20{% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %}">
                    <i data-lucide="{% if category == 'erro' %}alert-triangle{% else %}check-circle-2{% endif %}" class="w-4 h-4 shrink-0"></i>
                    <span>{{ message }}</span>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Abas Login / Cadastro -->
        <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 dark:bg-[#0a0e1a] border border-slate-200 dark:border-slate-800 mb-6">
            <button id="tab-login" type="button" onclick="mostrarAba('login')" class="py-2.5 text-sm font-semibold rounded-lg bg-accent text-white shadow transition-all">
                Entrar
            </button>
            <button id="tab-registro" type="button" onclick="mostrarAba('registro')" class="py-2.5 text-sm font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                Criar Conta
            </button>
        </div>

        <!-- Formulário de Login -->
        <form id="form-login" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Nome de Usuário</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="text" name="username" required placeholder="seu.usuario"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0d1220] border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-accent">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0d1220] border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-accent">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-accent hover:bg-rose-600 text-white font-semibold text-sm shadow-lg shadow-accent/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Acessar Painel de Quedas
            </button>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="form-registro" action="/registro" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Seu Nome</label>
                <input type="text" name="nome" required placeholder="Ex: Maria Silva"
                    class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0d1220] border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-accent">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Usuário para Login</label>
                    <input type="text" name="username" required minlength="3" placeholder="Ex: maria"
                        class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0d1220] border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">ID da Pulseira</label>
                    <input type="text" name="esp_id" value="ESP_SALA_01" required
                        class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0d1220] border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-accent">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Senha (mín. 6 caracteres)</label>
                <input type="password" name="password" required minlength="6" placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-[#0d1220] border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-accent">
            </div>

            <!-- Aceite dos termos de uso -->
            <div class="rounded-xl p-3 bg-slate-50 dark:bg-[#0d1220] border border-slate-200 dark:border-slate-800">
                <label class="flex items-start gap-2.5 cursor-pointer select-none">
                    <input type="checkbox" name="consentimento_lgpd" required class="mt-0.5 rounded border-slate-400 text-accent focus:ring-accent">
                    <span class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                        Concordo com os termos de privacidade e autorizo o uso do meu contato para o recebimento de alertas de queda.
                    </span>
                </label>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-accent hover:bg-rose-600 text-white font-semibold text-sm shadow-lg shadow-accent/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Criar Conta
            </button>
        </form>

        <!-- Rodapé Informativo -->
        <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-center text-[11px] text-slate-400">
            <span>Monitoramento Inteligente de Quedas • Sensor BMI160</span>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function mostrarAba(aba) {
            const formLogin = document.getElementById('form-login');
            const formRegistro = document.getElementById('form-registro');
            const tabLogin = document.getElementById('tab-login');
            const tabRegistro = document.getElementById('tab-registro');

            if (aba === 'login') {
                formLogin.classList.remove('hidden');
                formRegistro.classList.add('hidden');
                tabLogin.className = "py-2.5 text-sm font-semibold rounded-lg bg-accent text-white shadow transition-all";
                tabRegistro.className = "py-2.5 text-sm font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
            } else {
                formLogin.classList.add('hidden');
                formRegistro.classList.remove('hidden');
                tabRegistro.className = "py-2.5 text-sm font-semibold rounded-lg bg-accent text-white shadow transition-all";
                tabLogin.className = "py-2.5 text-sm font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.setAttribute('data-lucide', 'sun');
            } else {
                html.classList.add('dark');
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
