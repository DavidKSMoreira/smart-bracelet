<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Tempo Real - {{ esp_id }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; }
        .chart-container { width: 90%; max-width: 1000px; margin: 30px auto; background: white; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="chart-container">
        <h2>Monitoramento: {{ esp_id }}</h2>
        <canvas id="meuGrafico"></canvas>
    </div>

    <script>
        const esp_id = "{{ esp_id }}";
        const ctx = document.getElementById('meuGrafico').getContext('2d');
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: [],
                        borderColor: 'rgb(255, 99, 132)',
                        yAxisID: 'y',
                        tension: 0.1
                    },
                    {
                        label: 'Batimentos (BPM)',
                        data: [],
                        borderColor: 'rgb(54, 162, 235)',
                        yAxisID: 'y1',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: {display: true, text: 'Temp °C'} },
                    y1: { type: 'linear', display: true, position: 'right', grid: {drawOnChartArea: false}, title: {display: true, text: 'BPM'} }
                }
            }
        });

        async function atualizarGrafico() {
            try {
                const response = await fetch(`/api/historico?esp_id=${esp_id}`);
                const data = await response.json();

                if (data.labels && data.labels.length > 0) {
                    chart.data.labels = data.labels;
                    chart.data.datasets[0].data = data.temperatura;
                    chart.data.datasets[1].data = data.batimentos;
                    chart.update('none'); // 'none' para animação suave
                }
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
            }
        }

        // Atualiza a cada 2 segundos
        setInterval(atualizarGrafico, 2000);
        atualizarGrafico(); // Chamada inicial
    </script>
</body>
</html>
