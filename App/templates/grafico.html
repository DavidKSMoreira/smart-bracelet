<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico em Tempo Real - {{ esp_id }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; }
        .chart-container {
            width: 80%;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 { text-align: center; color: #333; }
        a { color: #007bff; }
        /*Estilo para o novo painel de controle*/
        .painel-controle {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        select {padding: 5px; font-size: 16px; border-radius: 4px;}
    </style>
</head>
<body>
    <div class="chart-container">
        <h1>Monitor de Dados</h1>
        <h2>ESP ID: <span id="espIdDisplay">{{ esp_id }}</span></h2>

        <div class="painel-controle">
            <label for="filtroTempo"><strong>Visualizar histórico: </strong></label>
            <select id="filtroTempo" onchange="atualizarGrafico()">
                <option value="">Últimos 20 registros (Padrão)</option>
                <option value="1">Última 1 hora</option>
                <option value="2">Últimas 2 horas</option>
                <option value="6">Últimas 6 horas</option>
                <option value="12">Últimas 12 horas</option>
                <option value="24">Últimas 24 horas</option>
            </select>
        </div>

        <canvas id="meuGrafico"></canvas>
    </div>
    <div style="text-align: center;">
        <a href="/">Voltar para a lista</a>
    </div>

    <script>
        // Pega o ID que veio do Flask
        const espId = "{{ esp_id }}";
        const ctx = document.getElementById('meuGrafico').getContext('2d');
        
        // Configuração inicial do gráfico (vazio)
        const meuGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Começa vazio
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: [],
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderWidth: 2,
                        tension: 0.1,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Batimentos (BPM)',
                        data: [],
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 2,
                        tension: 0.1,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Temperatura' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'BPM' },
                        grid: { drawOnChartArea: false }
                    }
                },
                animation: false // Desativa animação para atualização mais rápida
            }
        });

        // --- FUNÇÃO DE ATUALIZAÇÃO ---
        async function atualizarGrafico() {
            try {
                //Novo: Leitura do valor do seletor e URL dinâmica
                const horasSelecionadas = document.getElementById('filtroTempo').value;
                let url = `/api/dados_grafico?esp_id=${espId}`;

                if (horasSelecionadas !== ""){
                    url += `&horas=${horasSelecionadas}`;
                }
                // Chama a nova rota criada no Python
                const response = await fetch(url);
                const dados = await response.json();

                if (dados.error) {
                    console.error("Erro na API:", dados.error);
                    return;
                }

                // Atualiza os dados do gráfico
                meuGrafico.data.labels = dados.labels;
                meuGrafico.data.datasets[0].data = dados.temperatura;
                meuGrafico.data.datasets[1].data = dados.batimentos;

                //NOVO: Lógica de alerta visual de queda
                //Se queda == 1, cor vermelha e tamanho maior

                const coresTemp = dados.quedas.map(queda => queda === 1 ? 'red' : 'rgba (255, 99, 132, 1)');
                const coresBPM = dados.quedas.map(queda => queda === 1 ? 'red' : 'rgba(255, 99, 132, 1)');
                const tamanhosPonto = dados.quedas.map(queda => queda === 1 ? 8 : 3); //8 grande, 3 padrão

                //Aplica as listas de estilo nas linhas do gráfico
                meuGrafico.data.datasets[0].pointBackgroundColor = coresTemp;
                meuGrafico.data.datasets[0].pointRadius = tamanhosPonto;
                meuGrafico.data.datasets[0].pointBorderColor = coresTemp;

                meuGrafico.data.datasets[1].pointBackgroundColor = coresBPM;
                meuGrafico.data.datasets[1].pointRadius = tamanhosPonto;
                meuGrafico.data.datasets[1].pointBorderColor = coresBPM;

                // Manda o Chart.js redesenhar com os novos estilps
                meuGrafico.update('none'); // 'none' evita animação completa a cada update
                
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
            }
        }

        // Executa a primeira vez imediatamente
        atualizarGrafico();

        // Repete a cada 3 segundos (3000 ms)
        setInterval(atualizarGrafico, 3000);

    </script>
</body>
</html>
