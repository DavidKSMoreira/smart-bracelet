<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Quedas</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; color: #333; }
        .dashboard-container {
            width: 80%; max-width: 800px; margin: 40px auto;
            padding: 30px; background-color: white;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #d9534f; }
        h2 { text-align: center; color: #555; }
        
        .contador-box {
            background-color: #fdf2f2; border: 2px solid #d9534f;
            border-radius: 8px; padding: 20px; text-align: center;
            margin: 30px 0;
        }
        .numero-gigante { font-size: 48px; font-weight: bold; color: #d9534f; margin: 10px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
        
        .painel-controle { text-align: center; margin-bottom: 20px; }
        select { padding: 8px; font-size: 16px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>🚨 Monitor de Quedas</h1>
        <h2>Dispositivo: <span id="espIdDisplay">{{ esp_id }}</span></h2>

        <div class="painel-controle">
            <label for="filtroTempo"><strong>Filtrar Histórico: </strong></label>
            <select id="filtroTempo" onchange="atualizarDashboard()">
                <option value="">Todo o histórico recente</option>
                <option value="1">Última 1 hora</option>
                <option value="6">Últimas 6 horas</option>
                <option value="24">Últimas 24 horas</option>
            </select>
        </div>

        <div class="contador-box">
            <h3>Total de Quedas Detectadas</h3>
            <div class="numero-gigante" id="totalQuedas">0</div>
        </div>

        <h3>Histórico de Eventos (Dia e Horário)</h3>
        <table id="tabelaQuedas">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Data e Hora da Queda</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                </tbody>
        </table>
    </div>

    <script>
        const espId = "{{ esp_id }}";

        async function atualizarDashboard() {
            try {
                const horas = document.getElementById('filtroTempo').value;
                let url = `/api/dados_grafico?esp_id=${espId}`;
                if (horas !== "") url += `&horas=${horas}`;

                const response = await fetch(url);
                const dados = await response.json();

                if (dados.error) return console.error("Erro:", dados.error);

                // Atualiza o contador gigante
                document.getElementById('totalQuedas').innerText = dados.total_quedas;

                // Limpa a tabela atual
                const tbody = document.getElementById('corpoTabela');
                tbody.innerHTML = '';

                // Preenche a tabela com os horários
                if (dados.total_quedas === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">Nenhuma queda registrada neste período.</td></tr>';
                } else {
                    dados.horarios_quedas.forEach((horario, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td><strong>${horario}</strong></td>
                            <td style="color: red; font-weight: bold;">CRÍTICO</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
            }
        }

        atualizarDashboard();
        setInterval(atualizarDashboard, 3000); // Atualiza a cada 3 segundos
    </script>
</body>
</html>
